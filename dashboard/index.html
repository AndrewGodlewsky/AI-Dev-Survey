<!doctype html>

<title>AI-Dev-Survey — results</title>
<!--
  AI-Dev-Survey dashboard. One file, no dependencies, opened from disk.
  Built in wayfinder ticket #16 from the #11 prototype (Explorer shell) against the Scored CSV contract in
  scoring/scored-csv-schema.md. Load a scored CSV with the picker or by dropping it on the page.

  The dashboard computes TEAM statistics only (means, ranges, medians, counts, draft norms, n). Every per-Respondent
  number comes from the CSV; nothing is re-scored here. Label text and rubric prose are owned here (rubric/RUBRIC.md).

  Dev aid: ?csv=<path> fetches a file — only works when the browser allows file:// fetches (e.g. headless Chrome with
  --allow-file-access-from-files) or when served over http. From disk, use the picker.
-->
<style>

  color-scheme:light;

  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10); --wash:rgba(11,11,11,.04);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s8:#e34948;
  --div-neg:#2a78d6; --div-pos:#e34948;
  --q1:#cde2fb;--q2:#b7d3f6;--q3:#9ec5f4;--q4:#86b6ef;--q5:#6da7ec;--q6:#5598e7;--q7:#3987e5;--q8:#256abf;
  --o1:#86b6ef;--o2:#6da7ec;--o3:#5598e7;--o4:#3987e5;--o5:#2a78d6;--o6:#1c5cab;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  color-scheme:dark;
  --surface:#1a1a19; --page:#0d0d0d; --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --wash:rgba(255,255,255,.05);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s8:#e66767;
  --div-neg:#3987e5; --div-pos:#e66767;
  --q1:#184f95;--q2:#1c5cab;--q3:#256abf;--q4:#2a78d6;--q5:#3987e5;--q6:#5598e7;--q7:#6da7ec;--q8:#86b6ef;
  --o1:#184f95;--o2:#1c5cab;--o3:#256abf;--o4:#2a78d6;--o5:#3987e5;--o6:#5598e7;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit}
h1{font-size:20px;margin:0;font-weight:650}
h2{font-size:16px;margin:0 0 8px;font-weight:650}

.hdr{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:baseline;margin-bottom:12px}
.hdr .sub{color:var(--ink2)}
.filters{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:14px}
.filters label{color:var(--ink2);font-size:12px;margin-right:4px}
.filters select{font:inherit;font-size:13px;padding:3px 6px;background:var(--surface);color:var(--ink);border:1px solid var(--axis);border-radius:5px}

<div id="app" class="app"></div>
<div id="tip" class="tip" hidden></div>

<script>
/* ============================================================
   0. DOMAIN CONSTANTS — label tables and rubric prose (rubric/RUBRIC.md); the CSV carries none of this
   ============================================================ */
const DIMS = [
 {key:'comfort', name:'Comfort', probe:'P1',
  levels:['Would rather not use AI for development work at all; uses it only when there is no alternative.',
   'Uses AI for peripheral, low-stakes things — lookups, explanations, boilerplate — and keeps it away from real work.',
   'Comfortable using AI on everyday work, but switches it off for anything important, unfamiliar, or high-blast-radius.',
   'Reaches for AI by default on most work, including work that matters; only a few areas are deliberately held back.',
   'AI is the default starting point for essentially all development work; working without it is the exception that needs a reason.']},
 {key:'trust', name:'Trust', probe:'P2',
  levels:['Assumes AI output is wrong until proven otherwise; nothing is believed before it has been read in full.',
   'Expects frequent errors; output is usable only after being checked end to end.',
   'Trusts AI output on familiar, well-specified work; anything else gets full scrutiny.',
   'Generally trusts AI output and reviews it the way a competent colleague\'s work is reviewed — read and judged, not re-derived.',
   'Treats AI output as correct unless a test, check, or reviewer says otherwise; line-by-line reading is reserved for when something fails.']},
 {key:'fluency', name:'Fluency', soft:true,
  levels:['Little or no hands-on use; unclear what the tools can do or how to drive them.',
   'Uses a chat or autocomplete tool as it comes out of the box; prompting is ad-hoc and results are hit-or-miss.',
   'Gets reliable results on ordinary tasks — knows how to supply context, iterate on a prompt, and recognise a bad answer.',
   'Works fluently with agents and multi-step workflows; configures the tooling and knows the common failure modes.',
   'Builds and tunes AI workflows that others use; treats setup, evaluation, and failure modes as part of the craft.']},
 {key:'guardrails', name:'Guardrails', note:'high is not "good" — how much process this person wants',
  levels:['AI-assisted work needs no special treatment; the team\'s existing rules are already enough.',
   'Norms rather than rules: people are expected to use judgement, with maybe a convention or two and nothing enforced.',
   'A few explicit expectations for AI-assisted work — e.g. tests required, author reads it before opening a PR — held by agreement.',
   'Written team rules covering what must be reviewed, disclosed, and tested, plus agreed limits on where AI may be used at all.',
   'Controls enforced in the tooling: mandatory disclosure, required human review, gates in CI, and named areas AI may not touch.']},
 {key:'concern', name:'Concern', probe:'P4', note:'5 = most concerned; high is not "bad"',
  levels:['No meaningful risk beyond the ordinary risks of writing software; nothing here needs watching.',
   'The risks are real in principle but not live for this team on this work; awareness is enough.',
   'One or two risk areas warrant active attention; the rest can be left alone.',
   'Several risk areas warrant active attention at once, and real damage is expected if adoption continues unchanged.',
   'Risk is the dominant fact about AI-assisted development; serious harm is expected unless something changes.']},
 {key:'autonomy', name:'Autonomy', probe:'P3',
  levels:['Inline assistance only: completions and suggestions in the editor, accepted or rejected one at a time.',
   'Chat: AI answers questions and produces snippets; a human carries every change into the codebase.',
   'Supervised agent: AI edits files and runs commands while a human watches each step and approves the risky ones.',
   'Delegated agent: AI is handed a task and works unattended, then hands back a finished change a human reviews before it lands.',
   'Autonomous agent: AI takes a task all the way to landed work, with automated checks — not a person — as the gate.']},
 {key:'craft-values', name:'Craft values', probe:'P5', soft:true,
  levels:['Working software is what counts; understanding, tests, and review are overhead to be skipped when they slow delivery.',
   'Worth having in principle, but the first thing to drop under pressure.',
   'A working baseline holds — reviewed, reasonably tested, understood by whoever ships it — traded away deliberately when the cost is high.',
   'Understanding, tests, review, and ownership are non-negotiable for anything that reaches production.',
   'Craft is the point: nothing ships that its author cannot explain line by line, even at real cost to speed.']},
];
const DIM = Object.fromEntries(DIMS.map(d=>[d.key,d]));
const PROBES = [
 {id:'P1', dim:'comfort', pole:'low',  me:'…be happy working with no AI tooling at all, the way I worked before it existed.'},
 {id:'P2', dim:'trust', pole:'high',   me:'…merge AI-written code I had not read line by line, as long as the tests pass.'},
 {id:'P3', dim:'autonomy', pole:'high',me:'…let an agent work unsupervised for an hour and only look at the final result.'},
 {id:'P4', dim:'concern', pole:'high', me:'…slow down how fast I adopt AI, because the risks outweigh what I\'d gain.'},
 {id:'P5', dim:'craft-values', pole:'high', me:'…expect to be able to explain every line of code that ships under my name.'},
];
const PROBE = Object.fromEntries(PROBES.map(p=>[p.id,p]));
const LEVELS = ['None','Advisor','Drafter','Doer, reviewed','Doer, spot-checked','System-verified'];
const LEVEL_DEF = ['I do this without AI.','I ask AI to explain, look up, or suggest; every artifact is written by me.','AI produces a first draft; I read and edit all of it before it counts.','AI produces the finished artifact; I review it as I would a colleague\'s work.','AI produces it; I sample or skim rather than review fully.','AI produces it end-to-end; no individual looks unless automated checks fail.'];
const AREAS = [
 ['requirements','Core SDLC','Requirements & ideation'],['architecture','Core SDLC','Architecture & design'],['production-code','Core SDLC','Writing production code'],['tests','Core SDLC','Writing tests'],['code-review','Core SDLC','Code review'],['debugging','Core SDLC','Debugging'],['documentation','Core SDLC','Documentation'],['refactoring','Core SDLC','Refactoring & legacy migration'],
 ['ci-cd','Ops & delivery','CI/CD & build configuration'],['infrastructure','Ops & delivery','Infrastructure-as-code'],['incident-response','Ops & delivery','Incident response & on-call'],['monitoring','Ops & delivery','Monitoring & alerting'],
 ['data-migrations','Data & security','SQL & data migrations'],['security-review','Data & security','Security review & threat modeling'],['dependency-upgrades','Data & security','Dependency upgrades'],
 ['estimates','Non-code','Estimates & planning'],['stakeholder-comms','Non-code','Stakeholder comms & PR descriptions'],['learning','Non-code','Learning new tech'],['meeting-notes','Non-code','Meeting notes & summaries'],
].map(([slug,group,name],i)=>({i, slug, group, name, hs:['code-review','ci-cd','infrastructure','incident-response','data-migrations','security-review'].includes(slug)}));
const CUSTOM = {
 'code-review':['I review PRs without AI.','AI explains the diff or answers my questions; I write every review comment.','AI drafts review comments; I rewrite them before posting.','AI posts its review; I still read the whole diff and add or veto comments.','AI posts its review; I skim the diff and its findings.','AI review is the merge gate; no human reviewer unless it flags something.'],
 'incident-response':['I handle incidents without AI.','AI helps me read logs/errors and suggests hypotheses; I do everything.','AI proposes a diagnosis and a fix; I verify the diagnosis and rewrite the fix myself.','AI diagnoses and prepares the remediation; I review and execute it.','AI executes the remediation; I spot-check afterwards.','AI auto-remediates; monitors and rollback guards catch mistakes, no human in the loop.'],
 'security-review':['I do security review without AI.','AI explains vulnerability classes or a specific finding; I do the review.','AI drafts a threat model / findings list; I re-derive and rewrite it.','AI produces the findings; I review each finding and the code it points at.','AI produces the findings; I spot-check the high-severity ones.','AI security gates in CI decide; no human security review unless a gate fails.'],
 'learning':['I learn from docs, books, and people; no AI.','AI answers questions while I work through the material myself.','AI builds me a tailored tutorial or example; I work through and verify all of it.','AI summarizes the tech and I rely on the summary after checking key claims.','AI summarizes; I skim and trust it.','I don\'t learn it — AI applies the tech for me and checks catch errors.'],
};
const anchor = (a, lvl) => (CUSTOM[a.slug] || LEVEL_DEF)[lvl-1];
const SAFEGUARDS = [['read-myself','I\'d read it myself — nothing on this list changes that'],['another-person','Another person reviews it'],['tests','The test suite passes'],['rollback','It\'s easy to roll back if it\'s wrong'],['schema-check','A type check or schema validation covers it'],['small-blast-radius','The blast radius is small (docs, internal tooling, non-production)'],['security-scan','An automated security or lint scan covers it']];
const SG_SHORT = s => s.split(' — ')[0];
const TOOLS = [['copilot','GitHub Copilot'],['copilot-studio','Copilot Studio'],['m365-copilot','Microsoft 365 Copilot'],['azure-ai-foundry','Azure AI Foundry'],['other-tool','Another AI tool']];
const TOOL_STATES = ['Never used','Tried it, not using it now','Use it occasionally','Use it regularly'];
const PASSES = [['cur','Today','current'],['fp','In 6 months — me','future-personal'],['ft','In 6 months — team should','future-team']];
const PASS = Object.fromEntries(PASSES.map(([k,l])=>[k,l]));
const CSVPASS = Object.fromEntries(PASSES.map(([k,,c])=>[k,c]));
const SCHEMA = '1';

/* ============================================================
   1. CSV LOADER — scoring/scored-csv-schema.md §6
   ============================================================ */
function parseCSV(text){
  if (text.charCodeAt(0)===0xFEFF) text = text.slice(1);              // BOM
  const firstLine = text.split(/\r?\n/,1)[0];
  const delim = (firstLine.match(/;/g)||[]).length > (firstLine.match(/,/g)||[]).length ? ';' : ',';   // sniff
  const rows=[]; let row=[], cell='', q=false;
  for (let i=0;i<text.length;i++){ const c=text[i];
    if (q){ if (c==='"'){ if (text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=c; }
    else if (c==='"') q=true;
    else if (c===delim){ row.push(cell); cell=''; }
    else if (c==='\n'||c==='\r'){ if (c==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell+=c; }
  if (cell.length||row.length){ row.push(cell); rows.push(row); }
  const header = rows.shift().map(h=>h.trim());
  const records = rows.filter(r=>r.some(x=>x!=='')).map(r=>Object.fromEntries(header.map((h,i)=>[h, (r[i]??'').trim()])));
  return {header, records, delim};
}
// three tokens, three meanings — by name
const T = { NA:'NA', MALFORMED:'#N/A' };
const num = v => (v===T.NA||v===T.MALFORMED||v===''||v==null) ? null : Number(v);
const isNum = v => typeof v==='number' && Number.isFinite(v);

function loadRespondents(parsed){
  const {header, records} = parsed;
  const have = new Set(header);
  const need = ['schema','respondent','roster_n',
    ...DIMS.flatMap(d=>['current','future-personal','future-team'].map(p=>`dimension.${d.key}.${p}`)),
    ...DIMS.flatMap(d=>[`gap.${d.key}.personal`,`gap.${d.key}.stance`]),
    ...AREAS.flatMap(a=>['current','future-personal','future-team'].map(p=>`area.${a.slug}.${p}`))];
  const missing = need.filter(c=>!have.has(c));
  if (missing.length) throw new Error(`This file is missing ${missing.length} required column${missing.length>1?'s':''}: ${missing.slice(0,6).join(', ')}${missing.length>6?', …':''}. Expected the Scored CSV described in scoring/scored-csv-schema.md.`);
  const optionalMissing = header.length < 279 ? `${279-header.length} of the 279 columns absent — some views may be empty.` : null;
  const bad = records.filter(r=>r.schema!==SCHEMA);
  if (bad.length) throw new Error(`Schema version ${[...new Set(bad.map(r=>r.schema||'(blank)'))].join(', ')} — this dashboard reads schema ${SCHEMA}.`);
  const people = records.map((r,idx)=>{
    const p = { id:idx, name:r.respondent||`Respondent ${idx+1}`, completed:r.completed||'', row:r };
    p.ini = p.name.split(/\s+/).map(w=>w[0]||'').join('').slice(0,2).toUpperCase() || String(idx+1);
    p.tools = TOOLS.map(([slug])=> num(r[`context.${slug}`]));
    p.malformed = (r['flag.malformed']&&r['flag.malformed']!=='0') ? r['flag.malformed'].split(/[;,]\s*/).filter(Boolean) : [];
    p.scores = {};
    for (const d of DIMS){
      const s = {cur:num(r[`dimension.${d.key}.current`]), fp:num(r[`dimension.${d.key}.future-personal`]), ft:num(r[`dimension.${d.key}.future-team`]),
        gap:num(r[`gap.${d.key}.personal`]), stance:num(r[`gap.${d.key}.stance`])};
      s.malformed = [r[`dimension.${d.key}.current`], r[`dimension.${d.key}.future-personal`], r[`dimension.${d.key}.future-team`]].some(v=>v===T.MALFORMED);
      p.scores[d.key] = s;
    }
    p.cov = AREAS.map(a=>({cur:num(r[`area.${a.slug}.current`]), fp:num(r[`area.${a.slug}.future-personal`]), ft:num(r[`area.${a.slug}.future-team`]),
      gap:num(r[`area-gap.${a.slug}.personal`]), stance:num(r[`area-gap.${a.slug}.stance`])}));
    p.probes = {}; p.edges = {};
    for (const pr of PROBES){ p.probes[pr.id] = [num(r[`probe.${pr.id}.future-personal`]), num(r[`probe.${pr.id}.future-team`])];

const S = { data:null, error:null, view:'internal', compare:'cur-fp', lensTool:null, lensState:null, pass:'cur', person:0, topic:'overview', dim:'trust' };
function filtered(){ return S.data.people.filter(p => S.lensTool==null || S.lensState==null || p.tools[S.lensTool]===S.lensState); }
function FilterRow(){
  const sel = (opts, cur, on) => el('select',{onchange:e=>{ on(e.target.value===''?null:+e.target.value); render(); }}, el('option',{value:''},'Any'), ...opts.map((o,i)=>el('option',{value:i, selected:cur===i||null}, o)));

    el('span',{}, el('label',{},'Lens: tool'), sel(TOOLS.map(t=>t[1]), S.lensTool, v=>S.lensTool=v), ' ', el('label',{},'state'), sel(TOOL_STATES, S.lensState==null?null:S.lensState-1, v=>S.lensState=v===null?null:v+1)),
    el('span',{}, el('label',{},'View'), el('span',{class:'seg'}, el('button',{class:S.view==='internal'?'on':'', onclick:()=>{S.view='internal';render();}},'Internal (named)'), el('button',{class:S.view==='export'?'on':'', onclick:()=>{S.view='export';render();}},'Exported team view'))),
    el('span',{}, el('label',{},'Connector'), el('span',{class:'seg'}, el('button',{class:S.compare==='cur-fp'?'on':'', onclick:()=>{S.compare='cur-fp';render();}},'Today → 6 months (me)'), el('button',{class:S.compare==='fp-ft'?'on':'', onclick:()=>{S.compare='fp-ft';render();}},'Me → team should'))),
    el('span',{class:'note'}, `n = ${filtered().length} of ${S.data.roster}`),
    el('button',{class:'btn',style:'margin-left:auto',onclick:()=>{S.data=null;S.error=null;render();}},'Load another file'));
}
function Banner(){ return S.view==='export' ? el('div',{class:'banner'}, el('b',{},'Exported team view — may reach the manager. '), 'Names removed; distributions shown as unnamed counts per level. At n=5–9 an unnamed distribution is partially re-identifiable by anyone who knows the team — stated, not hidden.') : document.createDocumentFragment(); }

function LoadScreen(root){
  const drop = el('div',{class:'drop'},
    el('h2',{},'Load a scored CSV'),
    el('p',{}, 'Drop the file here, or ', el('label',{}, el('input',{type:'file',accept:'.csv,text/csv',onchange:e=>{ if (e.target.files[0]) readFile(e.target.files[0]); }}))),
    el('p',{class:'note'},'The file the Scoring sheet exports ("CSV UTF-8 (comma delimited)"), described in scoring/scored-csv-schema.md — one row per Respondent, schema 1. Nothing leaves this page: the file is read in your browser and never uploaded.'),
    S.error ? el('div',{class:'banner',style:'text-align:left'}, el('b',{},'Could not load that file. '), S.error) : null);
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev, e=>{ e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev, e=>{ e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e=>{ const f = e.dataTransfer.files[0]; if (f) readFile(f); });
  root.append(el('div',{class:'hdr'}, el('h1',{},'AI-Dev-Survey — results'), el('span',{class:'sub'},'internal — results are named and shared within the team')), drop);
}
function readFile(file){ const r = new FileReader(); r.onload = () => loadText(r.result, file.name); r.readAsText(file, 'utf-8'); }
function loadText(text, name){
  try { const parsed = parseCSV(text); S.data = loadRespondents(parsed); S.data.file = name; S.error=null; S.topic='overview'; }
  catch (e){ S.data=null; S.error = e.message; }
  render();
}

  const people = filtered(), D = S.data;
  root.append(el('div',{class:'hdr'}, el('h1',{},'AI-Dev-Survey — results'), el('span',{class:'sub'}, `${D.file} · ${D.people.length} of ${D.roster} submitted · schema ${SCHEMA}${D.delim===';'?' · semicolon-delimited':''}`)),
    ...D.warnings.map(w=>el('div',{class:'warn'}, w)), FilterRow(), Banner());
  const topics = [
    ...DIMS.map(d=>{ const t=teamDim(d,people); return {key:'dim:'+d.key, kind:'Dimension', name:d.name, spread:isNum(t.cur.range)?t.cur.range:0, max:4, gap:sgn(t.gap)}; }),
    ...AREAS.map(a=>{ const t=teamArea(a,people); return {key:'area:'+a.i, kind:a.group, name:a.name, spread:t.cur.range, max:5, gap: t.gap.median==null?'—':(t.gap.median>0?'+':'')+t.gap.median+' lv'}; }),
  ].sort((a,b)=> (b.spread/b.max)-(a.spread/a.max));

    el('div',{class:'topic '+(S.topic==='overview'?'on':''), style:'margin-bottom:6px', onclick:()=>{S.topic='overview';render();}}, el('div',{}, el('div',{class:'kind'},'At a glance'), el('b',{},'Team overview'), el('div',{class:'note',style:S.topic==='overview'?'color:inherit;opacity:.7':''},'unnamed — the manager page'))),
    el('h3',{style:'padding:4px 8px'},'Topics — most disagreement first'),
    ...topics.map(t=> el('div',{class:'topic '+(S.topic===t.key?'on':''), onclick:()=>{S.topic=t.key;render();}}, el('div',{}, el('div',{class:'kind'},t.kind), t.name), el('div',{class:'bar'}, el('i',{style:`width:${t.spread/t.max*100}%`})), el('div',{class:'num small'}, t.gap))),
    el('p',{class:'note',style:'padding:4px 8px'},'bar = range today (Dimension: max − min score; area: max − min level). Gap = team personal Gap.'),
    el('h3',{style:'padding:10px 8px 4px'},'Also'), ...[['people','People'],['stance','Stance gaps & probes'],['safe','Safeguards'],['craft','Craft × Comfort']].map(([k,l])=>el('div',{class:'topic '+(S.topic===k?'on':''), onclick:()=>{S.topic=k;render();}}, el('div',{}, l))));
  let detail;
  if (S.topic==='overview') detail = TeamOverview(people, D.roster);
  else if (S.topic.startsWith('dim:')){ const d=DIM[S.topic.slice(4)]; S.dim=d.key;
    const who = S.view==='internal' ? el('table',{}, el('thead',{}, el('tr',{}, el('th',{},'Person'), el('th',{class:'num'},'Today'), el('th',{class:'num'},'6 mo — me'), el('th',{class:'num'},'Team should'), el('th',{class:'num'},'Gap'), el('th',{class:'num'},'Stance gap'), el('th',{},'Edge'))),
      el('tbody',{}, ...[...people].sort((a,b)=>(b.scores[d.key].cur??-1)-(a.scores[d.key].cur??-1)).map(p=>{ const s=p.scores[d.key]; return el('tr',{}, el('td',{}, el('a',{href:'#',onclick:e=>{e.preventDefault();S.person=p.id;S.topic='person';render();}}, p.name), s.malformed? el('span',{class:'flag bad'},'malformed'):null), el('td',{class:'num'},f1(s.cur)), el('td',{class:'num'},f1(s.fp)), el('td',{class:'num'},f1(s.ft)), el('td',{class:'num'},sgn(s.gap)), el('td',{class:'num'},sgn(s.stance)), el('td',{}, d.probe&&p.edges[d.probe] ? el('i',{class:'mark '+(p.edges[d.probe]==='both'?'full':p.edges[d.probe]==='me'?'half':'')}) : '')); }))) : null;
    detail = el('div',{}, el('div',{class:'card'}, el('h2',{}, `${d.name} — Layered view`), LayeredDimension(d,people,S)),
      el('div',{class:'grid2'}, el('div',{class:'card'}, el('h2',{},'Team — how many at each level'), DimHistogram(d,people)), el('div',{class:'card'}, el('h2',{},'Team'), DimStats(d,people))),
      who ? el('div',{class:'card'}, el('h2',{},'Who is where'), who) : null,
      (d.key==='trust'||d.key==='autonomy') ? el('div',{}, el('h3',{},'Read with the Safeguards'), SafeguardsView(people,S)) : null);
  } else if (S.topic.startsWith('area:')){ const a=AREAS[+S.topic.slice(5)];
    detail = el('div',{}, el('div',{class:'card'}, el('h2',{}, a.name), el('div',{class:'note',style:'margin-bottom:8px'}, a.group), LayeredArea(a,people,S)),
      el('div',{class:'card'}, el('h2',{},'Team — how many at each level'), AreaHistogram(a,people)),
      el('div',{class:'card'}, el('h2',{},'In context — all areas'), CoverageHeatmap(people,S,i=>{S.topic='area:'+i;render();},a.i)));
  } else if (S.topic==='people'){
    detail = S.view==='internal' ? el('div',{}, el('div',{class:'chips',style:'margin-bottom:10px'}, ...D.people.map(p=>el('button',{class:'chip '+(S.person===p.id?'on':''), style:S.person===p.id?'background:var(--ink);color:var(--surface)':'', onclick:()=>{S.person=p.id;render();}}, p.name))), PersonProfile(D.people[S.person]||D.people[0],people,S)) : PersonProfile(null,people,S);
  } else if (S.topic==='person') detail = el('div',{}, el('a',{href:'#',class:'note',onclick:e=>{e.preventDefault();S.topic='dim:'+S.dim;render();}},'← back'), PersonProfile(D.people[S.person],people,S));
  else if (S.topic==='stance') detail = StanceView(people,S);
  else if (S.topic==='safe') detail = SafeguardsView(people,S);

function render(){ const y = scrollY, root = document.getElementById('app'); root.replaceChildren(); if (S.data) Shell(root); else LoadScreen(root); scrollTo(0,y); }

// dev aid: ?csv=path (works only where the browser permits fetching that path)
{ const q = new URLSearchParams(location.search); const src = q.get('csv');
  if (q.get('view')==='export') S.view='export'; if (q.get('topic')) S.topic=q.get('topic');
  if (src) fetch(src).then(r=>r.text()).then(t=>{ const keep=S.topic; loadText(t, src.split('/').pop()); if (q.get('topic')) { S.topic=keep; render(); } }).catch(e=>{ S.error = `Could not fetch ${src}: ${e.message}`; render(); });
