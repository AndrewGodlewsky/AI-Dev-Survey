<title>PROTOTYPE — dashboard Slices (fake data)</title>
<!--
  PROTOTYPE — THROWAWAY. Wayfinder ticket #11.

  Question: what Slices does the dashboard need, and what shape should each take?
  Plan:     three structurally different variants of the whole dashboard, switchable via
            ?variant=A|B|C (or #A/#B/#C) and the floating bar at the bottom.
              A — Slice tabs: one Slice at a time, full width.
              B — Overview wall: everything on one scrolling page, expand-in-place.
              C — Explorer: a "where do we disagree" list on the left, one topic on the right.
  Data:     7 fake people, generated at ITEM level (26 current + 25 future stems × 2 stances
            + 5 probes × 2 + 19×3 grid + safeguards) and scored with the real facet map from
            scoring/scoring-rules.md — so decimals, Gaps, N/A pairings, Edge markers and Levers
            come out of the actual rules, not hand-typed.
  Open from disk. No dependencies. Nothing persists.
-->
<style>
:root{
  color-scheme:light;
  --surface:#fcfcfb; --page:#f9f9f7; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;

  --div-neg:#2a78d6; --div-pos:#e34948; --div-mid:#f0efec;
  --q1:#cde2fb;--q2:#b7d3f6;--q3:#9ec5f4;--q4:#86b6ef;--q5:#6da7ec;--q6:#5598e7;--q7:#3987e5;--q8:#256abf;
  --o1:#86b6ef;--o2:#6da7ec;--o3:#5598e7;--o4:#3987e5;--o5:#2a78d6;--o6:#1c5cab;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  color-scheme:dark;
  --surface:#1a1a19; --page:#0d0d0d; --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --wash:rgba(255,255,255,.05);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s7:#9085e9; --s8:#e66767;
  --div-neg:#3987e5; --div-pos:#e66767; --div-mid:#383835;
  --q1:#184f95;--q2:#1c5cab;--q3:#256abf;--q4:#2a78d6;--q5:#3987e5;--q6:#5598e7;--q7:#6da7ec;--q8:#86b6ef;
  --o1:#184f95;--o2:#1c5cab;--o3:#256abf;--o4:#2a78d6;--o5:#3987e5;--o6:#5598e7;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit}
h1{font-size:20px;margin:0;font-weight:650}
h2{font-size:16px;margin:0 0 8px;font-weight:650}
h3{font-size:13px;margin:0 0 6px;font-weight:650;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.app{max-width:1280px;margin:0 auto;padding:20px 20px 90px}
.hdr{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:baseline;margin-bottom:12px}
.hdr .sub{color:var(--ink2)}
.proto{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 6px;border:1px solid var(--s8);color:var(--s8);border-radius:4px;vertical-align:middle;margin-left:8px}
.filters{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:14px}
.filters label{color:var(--ink2);font-size:12px;margin-right:4px}
.filters select{font:inherit;font-size:13px;padding:3px 6px;background:var(--surface);color:var(--ink);border:1px solid var(--axis);border-radius:5px}
.seg{display:inline-flex;border:1px solid var(--axis);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:13px;padding:4px 10px;background:transparent;color:var(--ink2);border:0;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--surface)}
.banner{padding:8px 12px;border-radius:6px;border:1px solid var(--s8);color:var(--ink);background:var(--wash);margin-bottom:14px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:14px}
.row>*{flex:1 1 300px;min-width:0}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:14px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--axis);margin-bottom:14px}
.tabs button{font:inherit;font-size:14px;padding:8px 12px;border:0;background:transparent;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}

.chips{display:flex;flex-wrap:wrap;gap:6px}

.name{fill:var(--ink);font-size:12.5px}
.lbl{fill:var(--ink2);font-size:11px}
.hair{stroke:var(--grid);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:5px}
.legend b{display:inline-block;width:3px;height:12px;vertical-align:-2px;margin-right:6px}
.legend .ln{display:inline-block;width:14px;height:0;border-top:2px solid;vertical-align:3px;margin-right:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{padding:8px 10px;border:1px solid var(--border);border-radius:6px}

.tip{position:fixed;z-index:50;max-width:340px;padding:8px 10px;background:var(--ink);color:var(--surface);border-radius:6px;font-size:12px;line-height:1.4;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}

.sw{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:#111;color:#fff;border:2px solid #ffd400;border-radius:999px;padding:6px 10px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.35);z-index:60}

.sw span{min-width:220px;text-align:center}

.mark.full{background:var(--ink)}
.mark.half{background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}

.expand{cursor:pointer}

.side{display:grid;grid-template-columns:320px 1fr;gap:14px}

.mini{display:grid;grid-template-columns:90px 1fr;gap:4px 8px;align-items:center;font-size:12px}
.covstrip{display:grid;grid-template-columns:repeat(19,1fr);gap:2px}
.covstrip div{height:16px;border-radius:2px;font-size:9px;text-align:center;line-height:16px;color:#fff}

kbd{font:inherit;font-size:11px;padding:0 4px;border:1px solid #666;border-radius:3px}
.lvl{width:auto;font-size:11.5px;border-collapse:separate;border-spacing:2px 1px}

.lvl th{color:var(--muted);font-weight:500;font-size:10.5px}

.lvl td.mdn{font-weight:700;text-decoration:underline;text-underline-offset:2px}
.lvl td.na{color:var(--ink2);border:1px dashed var(--axis)}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="tip" class="tip" hidden></div>
<div id="switcher" class="sw"></div>

<script>
/* ============================================================
   0. DOMAIN CONSTANTS (from CONTEXT.md, rubric/, survey/, scoring/)
   ============================================================ */
const DIMS = [
 {key:'comfort', name:'Comfort', probe:'P1', cur:['C1','C2','C3'], fut:['FC1','FC2','FC3'],
  levels:['Would rather not use AI for development work at all; uses it only when there is no alternative.',
   'Uses AI for peripheral, low-stakes things — lookups, explanations, boilerplate — and keeps it away from real work.',
   'Comfortable using AI on everyday work, but switches it off for anything important, unfamiliar, or high-blast-radius.',
   'Reaches for AI by default on most work, including work that matters; only a few areas are deliberately held back.',
   'AI is the default starting point for essentially all development work; working without it is the exception that needs a reason.']},
 {key:'trust', name:'Trust', probe:'P2', cur:['T1','T2','T3'], fut:['FT1','FT2','FT3'],
  levels:['Assumes AI output is wrong until proven otherwise; nothing is believed before it has been read in full.',
   'Expects frequent errors; output is usable only after being checked end to end.',
   'Trusts AI output on familiar, well-specified work; anything else gets full scrutiny.',
   'Generally trusts AI output and reviews it the way a competent colleague\'s work is reviewed — read and judged, not re-derived.',
   'Treats AI output as correct unless a test, check, or reviewer says otherwise; line-by-line reading is reserved for when something fails.']},
 {key:'fluency', name:'Fluency', soft:true, cur:['F1','F2','F3'], fut:['FF1','FF2','FF3'],
  levels:['Little or no hands-on use; unclear what the tools can do or how to drive them.',
   'Uses a chat or autocomplete tool as it comes out of the box; prompting is ad-hoc and results are hit-or-miss.',
   'Gets reliable results on ordinary tasks — knows how to supply context, iterate on a prompt, and recognise a bad answer.',
   'Works fluently with agents and multi-step workflows; configures the tooling and knows the common failure modes.',
   'Builds and tunes AI workflows that others use; treats setup, evaluation, and failure modes as part of the craft.']},
 {key:'guardrails', name:'Guardrails', note:'high is not "good" — how much process this person wants', cur:['G1',['G2','G3'],'G4','G5','G6'], fut:['FG1','FG2','FG3','FG4','FG5'],
  levels:['AI-assisted work needs no special treatment; the team\'s existing rules are already enough.',
   'Norms rather than rules: people are expected to use judgement, with maybe a convention or two and nothing enforced.',
   'A few explicit expectations for AI-assisted work — e.g. tests required, author reads it before opening a PR — held by agreement.',
   'Written team rules covering what must be reviewed, disclosed, and tested, plus agreed limits on where AI may be used at all.',
   'Controls enforced in the tooling: mandatory disclosure, required human review, gates in CI, and named areas AI may not touch.']},
 {key:'concern', name:'Concern', probe:'P4', note:'5 = most concerned; high is not "bad"', cur:['N1','N2','N3','N4','N5'], fut:['FN1','FN2','FN3','FN4','FN5'],
  levels:['No meaningful risk beyond the ordinary risks of writing software; nothing here needs watching.',
   'The risks are real in principle but not live for this team on this work; awareness is enough.',
   'One or two risk areas warrant active attention; the rest can be left alone.',
   'Several risk areas warrant active attention at once, and real damage is expected if adoption continues unchanged.',
   'Risk is the dominant fact about AI-assisted development; serious harm is expected unless something changes.']},
 {key:'autonomy', name:'Autonomy', probe:'P3', cur:['A1','A2','A3'], fut:['FA1','FA2','FA3'],
  levels:['Inline assistance only: completions and suggestions in the editor, accepted or rejected one at a time.',
   'Chat: AI answers questions and produces snippets; a human carries every change into the codebase.',
   'Supervised agent: AI edits files and runs commands while a human watches each step and approves the risky ones.',
   'Delegated agent: AI is handed a task and works unattended, then hands back a finished change a human reviews before it lands.',
   'Autonomous agent: AI takes a task all the way to landed work, with automated checks — not a person — as the gate.']},
 {key:'craft', name:'Craft values', probe:'P5', soft:true, cur:['V1','V2','V3'], fut:['FV1','FV2','FV3'],
  levels:['Working software is what counts; understanding, tests, and review are overhead to be skipped when they slow delivery.',
   'Worth having in principle, but the first thing to drop under pressure.',
   'A working baseline holds — reviewed, reasonably tested, understood by whoever ships it — traded away deliberately when the cost is high.',
   'Understanding, tests, review, and ownership are non-negotiable for anything that reaches production.',
   'Craft is the point: nothing ships that its author cannot explain line by line, even at real cost to speed.']},
];
const DIM = Object.fromEntries(DIMS.map(d=>[d.key,d]));
const REV = new Set(['C3','T2','F3','G6','N4','A2','V2','FC3','FT2','FF3','FG5','FN4','FA2','FV2']);

const PROBES = [
 {id:'P1', dim:'comfort', pole:'low',  me:'…be happy working with no AI tooling at all, the way I worked before it existed.', team:'…be fine going back to no AI tooling at all.'},
 {id:'P2', dim:'trust', pole:'high',   me:'…merge AI-written code I had not read line by line, as long as the tests pass.', team:'…merge AI-written code nobody has read line by line, as long as the tests pass.'},
 {id:'P3', dim:'autonomy', pole:'high',me:'…let an agent work unsupervised for an hour and only look at the final result.', team:'…let agents work unsupervised for an hour and only review the final result.'},
 {id:'P4', dim:'concern', pole:'high', me:'…slow down how fast I adopt AI, because the risks outweigh what I\'d gain.', team:'…slow down how fast we adopt AI, because the risks outweigh what we\'d gain.'},
 {id:'P5', dim:'craft', pole:'high',   me:'…expect to be able to explain every line of code that ships under my name.', team:'…expect everyone to be able to explain every line that ships under their name.'},
];
const PROBE = Object.fromEntries(PROBES.map(p=>[p.id,p]));

const LEVELS = ['None','Advisor','Drafter','Doer, reviewed','Doer, spot-checked','System-verified'];
const LEVEL_DEF = ['I do this without AI.','I ask AI to explain, look up, or suggest; every artifact is written by me.','AI produces a first draft; I read and edit all of it before it counts.','AI produces the finished artifact; I review it as I would a colleague\'s work.','AI produces it; I sample or skim rather than review fully.','AI produces it end-to-end; no individual looks unless automated checks fail.'];
const AREAS = [
 ['Core SDLC','Requirements & ideation'],['Core SDLC','Architecture & design'],['Core SDLC','Writing production code'],['Core SDLC','Writing tests'],['Core SDLC','Code review'],['Core SDLC','Debugging'],['Core SDLC','Documentation'],['Core SDLC','Refactoring & legacy migration'],
 ['Ops & delivery','CI/CD & build configuration'],['Ops & delivery','Infrastructure-as-code'],['Ops & delivery','Incident response & on-call'],['Ops & delivery','Monitoring & alerting'],
 ['Data & security','SQL & data migrations'],['Data & security','Security review & threat modeling'],['Data & security','Dependency upgrades'],
 ['Non-code','Estimates & planning'],['Non-code','Stakeholder comms & PR descriptions'],['Non-code','Learning new tech'],['Non-code','Meeting notes & summaries'],
].map(([group,name],i)=>({i, group, name, hs:[4,8,9,10,12,13].includes(i)}));
const CUSTOM = {
 4:['I review PRs without AI.','AI explains the diff or answers my questions; I write every review comment.','AI drafts review comments; I rewrite them before posting.','AI posts its review; I still read the whole diff and add or veto comments.','AI posts its review; I skim the diff and its findings.','AI review is the merge gate; no human reviewer unless it flags something.'],
 10:['I handle incidents without AI.','AI helps me read logs/errors and suggests hypotheses; I do everything.','AI proposes a diagnosis and a fix; I verify the diagnosis and rewrite the fix myself.','AI diagnoses and prepares the remediation; I review and execute it.','AI executes the remediation; I spot-check afterwards.','AI auto-remediates; monitors and rollback guards catch mistakes, no human in the loop.'],
 13:['I do security review without AI.','AI explains vulnerability classes or a specific finding; I do the review.','AI drafts a threat model / findings list; I re-derive and rewrite it.','AI produces the findings; I review each finding and the code it points at.','AI produces the findings; I spot-check the high-severity ones.','AI security gates in CI decide; no human security review unless a gate fails.'],
 17:['I learn from docs, books, and people; no AI.','AI answers questions while I work through the material myself.','AI builds me a tailored tutorial or example; I work through and verify all of it.','AI summarizes the tech and I rely on the summary after checking key claims.','AI summarizes; I skim and trust it.','I don\'t learn it — AI applies the tech for me and checks catch errors.'],
};
const anchor = (areaIdx, lvl) => (CUSTOM[areaIdx] || LEVEL_DEF)[lvl-1];

const SAFEGUARDS = ['I\'d read it myself — nothing on this list changes that','Another person reviews it','The test suite passes','It\'s easy to roll back if it\'s wrong','A type check or schema validation covers it','The blast radius is small (docs, internal tooling, non-production)','An automated security or lint scan covers it'];
const TOOLS = ['GitHub Copilot','Copilot Studio','Microsoft 365 Copilot','Azure AI Foundry','Another AI tool'];
const TOOL_STATES = ['Never used','Tried it, not using it now','Use it occasionally','Use it regularly'];
const PASSES = [['cur','Today'],['fp','In 6 months — me'],['ft','In 6 months — team should']];
const PASS = Object.fromEntries(PASSES);

/* ============================================================
   1. FAKE DATA — 7 personas, generated at item level
   ============================================================ */
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// dims: [current, future-me, future-team] targets. probes: [me, team]. cov: base level per group (core/ops/data/non),
// dMe/dTeam: future shift; over: area → [cur,fp,ft] (null = N/A); na: areas N/A in all three passes.
// safe: indices into SAFEGUARDS (0 = "I'd read it myself"). tools: TOOL_STATES index+1 per TOOLS row.
const PERSONAS = [
 {name:'Maya Okafor',   ini:'MO', tools:[4,2,3,4,4], dims:{comfort:[4.6,4.9,4.4],trust:[4.1,4.6,3.7],fluency:[4.5,4.8,4.4],guardrails:[1.8,1.7,2.4],concern:[1.7,1.9,2.3],autonomy:[4.2,4.8,3.9],craft:[2.9,2.7,3.3]},
  probes:{P1:[1,1],P2:[5,4],P3:[5,5],P4:[1,1],P5:[2,2]}, cov:{base:[4,3,3,5],dMe:1,dTeam:1,over:{4:[5,6,6],13:[4,5,4]},na:[]}, safe:{cur:[2,3,6],fp:[2,3,4,6],ft:[2,3,6],learn:[4,5]}},
 {name:'Tom Lindqvist', ini:'TL', tools:[2,2,1,1,1], dims:{comfort:[2.0,2.2,2.6],trust:[1.5,1.8,2.0],fluency:[2.6,3.2,3.4],guardrails:[4.5,4.7,4.6],concern:[4.4,4.5,4.3],autonomy:[1.6,1.8,2.2],craft:[4.8,4.9,4.8]},
  probes:{P1:[4,2],P2:[1,1],P3:[1,1],P4:[4,4],P5:[5,5]}, cov:{base:[2,1,2,2],dMe:0,dTeam:0,over:{17:[3,3,3]},na:[9,10]}, safe:{cur:[0],fp:[0],ft:[0],learn:[4]}},
 {name:'Priya Raman',   ini:'PR', tools:[4,1,3,4,2], dims:{comfort:[4.0,4.7,3.8],trust:[3.4,4.4,3.2],fluency:[4.0,4.6,4.0],guardrails:[2.6,2.2,3.2],concern:[2.4,2.3,3.0],autonomy:[3.4,4.7,3.0],craft:[3.6,3.4,3.8]},

const GROUP_IDX = {'Core SDLC':0,'Ops & delivery':1,'Data & security':2,'Non-code':3};

function generate(){
  const r = rng(20260826);
  const noise = ()=> (r()-0.5)*1.3;
  return PERSONAS.map((P,pi)=>{
    const cur={}, fp={}, ft={};
    for (const d of DIMS){
      const [tc,tp,tt] = P.dims[d.key];
      for (const f of d.cur.flat()){ const v=clamp(Math.round(tc+noise()),1,5); cur[f]= REV.has(f)? 6-v : v; }
      for (const f of d.fut){ const v1=clamp(Math.round(tp+noise()),1,5), v2=clamp(Math.round(tt+noise()),1,5); fp[f]=REV.has(f)?6-v1:v1; ft[f]=REV.has(f)?6-v2:v2; }
    }
    const cov = AREAS.map(a=>{
      if (P.cov.na.includes(a.i)) return {cur:null,fp:null,ft:null};
      if (P.cov.over[a.i]) { const [c,p,t]=P.cov.over[a.i]; return {cur:c,fp:p,ft:t}; }
      const base = P.cov.base[GROUP_IDX[a.group]] + (r()<0.25 ? (r()<0.5?-1:1) : 0);
      const c = clamp(base,1,6);
      const p = clamp(c + P.cov.dMe + (r()<0.2?1:0), 1, 6);
      const t = clamp(c + P.cov.dTeam + (r()<0.2?1:0), 1, 6);
      return {cur:c, fp:p, ft:t};
    });
    return {id:pi, name:P.name, ini:P.ini, tools:P.tools, cur, fp, ft, probes:P.probes, cov, safe:P.safe};
  });
}

/* ============================================================
   2. SCORING (pure) — scoring/scoring-rules.md
   ============================================================ */
const mean = xs => xs.length ? xs.reduce((a,b)=>a+b,0)/xs.length : NaN;
const val = (ans,f) => REV.has(f) ? 6-ans[f] : ans[f];
function dimScore(ans, facets){ return mean(facets.map(f => Array.isArray(f) ? mean(f.map(x=>val(ans,x))) : val(ans,f))); }
const label = x => Math.floor(x+0.5);             // nearest integer, halves up — a landmark, not the score
const f1 = x => Number.isFinite(x) ? x.toFixed(1) : '—';
const sgn = x => (x>0?'+':'')+f1(x);
function lowerMedian(xs){ const s=[...xs].sort((a,b)=>a-b); if(!s.length) return null; return s[Math.ceil(s.length/2)-1]; }

function scorePerson(p){
  p.scores = {};
  for (const d of DIMS){
    const c = dimScore(p.cur, d.cur), fpv = dimScore(p.fp, d.fut), ftv = dimScore(p.ft, d.fut);
    p.scores[d.key] = {cur:c, fp:fpv, ft:ftv, gap:fpv-c, stance:ftv-fpv};
  }
  // Edge markers from probes: fires at 4–5, per stance
  p.edges = {};
  for (const pr of PROBES){ const [me,team]=p.probes[pr.id]; const m=me>=4, t=team>=4; p.edges[pr.id] = m&&t?'both': m?'me': t?'team':null; }
  // Edge markers from the grid: level 6 on a high-stakes area, per pass
  p.covEdges = [];
  for (const a of AREAS) if (a.hs) for (const [k,lab] of PASSES) if (p.cov[a.i][k]===6) p.covEdges.push({area:a, pass:k});
  // Safeguards: inconsistency per list, levers by subtraction, principle hold, learning interest
  const inc = k => p.safe[k].includes(0) && p.safe[k].length>1;
  p.sg = { inconsistent: {cur:inc('cur'), fp:inc('fp'), ft:inc('ft')} };
  p.sg.hold = p.safe.fp.includes(0) && !p.sg.inconsistent.fp;
  p.sg.levers = (p.sg.inconsistent.cur||p.sg.inconsistent.fp) ? null : p.safe.fp.filter(s=>s!==0 && !p.safe.cur.includes(s));
  p.sg.dropped = (p.sg.inconsistent.cur||p.sg.inconsistent.fp) ? null : p.safe.cur.filter(s=>s!==0 && !p.safe.fp.includes(s));
  p.sg.learn = p.safe.learn.filter(s=>!p.safe.fp.includes(s));
  return p;
}

function teamDim(d, people){
  const m = k => { const xs = people.map(p=>p.scores[d.key][k]); const counts=[0,0,0,0,0]; xs.forEach(x=>counts[label(x)-1]++);
    return {mean:mean(xs), min:Math.min(...xs), max:Math.max(...xs), range:Math.max(...xs)-Math.min(...xs), n:xs.length, counts}; };
  const t = {cur:m('cur'), fp:m('fp'), ft:m('ft')};
  t.gap = t.fp.mean - t.cur.mean;      // team personal Gap (= mean of Gaps by linearity)
  t.norm = t.ft.mean - t.cur.mean;     // norm gap
  return t;
}
function teamArea(a, people){
  const pass = k => { const lv = people.map(p=>p.cov[a.i][k]); const num = lv.filter(x=>x!=null); const dist=[0,0,0,0,0,0]; num.forEach(x=>dist[x-1]++);
    return {dist, na: lv.length-num.length, n:num.length, median: lowerMedian(num), range: num.length? Math.max(...num)-Math.min(...num) : 0}; };
  const t = {cur:pass('cur'), fp:pass('fp'), ft:pass('ft')};
  const pairGap = (ka,kb) => { const diffs=[], naToLevel=[], levelToNa=[], both=[];
    for (const p of people){ const A=p.cov[a.i][ka], B=p.cov[a.i][kb]; if(A==null&&B==null) both.push(p); else if(A==null) naToLevel.push(p); else if(B==null) levelToNa.push(p); else diffs.push(B-A); }
    return {median: lowerMedian(diffs), pairs: diffs.length, naToLevel, levelToNa, both}; };
  t.gap = pairGap('cur','fp'); t.stance = pairGap('fp','ft');
  t.edges = []; if (a.hs) for (const p of people) for (const [k] of PASSES) if (p.cov[a.i][k]===6) t.edges.push({p, pass:k});
  return t;
}

function el(tag, attrs={}, ...kids){
  const ns = tag.startsWith('svg:');
  const e = ns ? document.createElementNS('http://www.w3.org/2000/svg', tag.slice(4)) : document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (v==null||v===false) continue;
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k==='html') e.innerHTML = v;
    else e.setAttribute(k, v);
  }
  for (const k of kids.flat(Infinity)){ if (k==null||k===false) continue; e.append(k.nodeType ? k : document.createTextNode(String(k))); }
  return e;
}
const TIP = document.getElementById('tip');
function tip(node, html){
  const show = ev => { TIP.innerHTML = typeof html==='function'? html() : html; TIP.hidden=false; move(ev); };
  const move = ev => { const x = Math.min(ev.clientX+14, innerWidth-360), y = Math.min(ev.clientY+14, innerHeight-120); TIP.style.left=x+'px'; TIP.style.top=y+'px'; };
  node.addEventListener('mouseenter', show); node.addEventListener('mousemove', move); node.addEventListener('mouseleave', ()=>TIP.hidden=true);
  return node;
}

const SERIES = [['cur','Today','var(--s1)'],['fp','In 6 months — me','var(--s2)'],['ft','In 6 months — team should','var(--s3)']];

    ...topics.map(t=> el('div',{class:'topic '+(S.topic===t.key?'on':''), onclick:()=>{S.topic=t.key;render();}}, el('div',{}, el('div',{class:'kind'},t.kind), t.name), el('div',{class:'bar'}, el('i',{style:`width:${t.spread/t.max*100}%`})), el('div',{class:'num small'}, t.gap))),
    el('p',{class:'note',style:'padding:4px 8px'},'bar = range today (Dimension: max − min score; area: max − min level). Gap = team personal Gap.'),
    el('h3',{style:'padding:10px 8px 4px'},'Also'), ...[['stance','Stance gaps & probes'],['safe','Safeguards'],['craft','Craft lens']].map(([k,l])=>el('div',{class:'topic '+(S.topic===k?'on':''), onclick:()=>{S.topic=k;render();}}, el('div',{}, l))));
  let detail;
  if (S.topic.startsWith('dim:')){ const d=DIM[S.topic.slice(4)];
    const who = S.view==='internal' ? el('table',{}, el('thead',{}, el('tr',{}, el('th',{},'Person'), el('th',{class:'num'},'Today'), el('th',{class:'num'},'6 mo — me'), el('th',{class:'num'},'Team should'), el('th',{class:'num'},'Gap'), el('th',{class:'num'},'Stance gap'), el('th',{},'Edge'))),
      el('tbody',{}, ...[...people].sort((a,b)=>b.scores[d.key].cur-a.scores[d.key].cur).map(p=>{ const s=p.scores[d.key]; return el('tr',{}, el('td',{}, el('a',{href:'#',onclick:e=>{e.preventDefault();S.person=p.id;S.topic='person';render();}}, p.name)), el('td',{class:'num'},f1(s.cur)), el('td',{class:'num'},f1(s.fp)), el('td',{class:'num'},f1(s.ft)), el('td',{class:'num'},sgn(s.gap)), el('td',{class:'num'},sgn(s.stance)), el('td',{}, d.probe&&p.edges[d.probe] ? el('i',{class:'mark '+(p.edges[d.probe]==='both'?'full':p.edges[d.probe]==='me'?'half':'')}) : '')); }))) : null;
    detail = el('div',{}, el('div',{class:'card'}, el('h2',{}, `${d.name} — Layered view`), LayeredDimension(d,people,S)),
      el('div',{class:'grid2'}, el('div',{class:'card'}, el('h2',{},'Team — how many at each level'), DimHistogram(d,people,S)), el('div',{class:'card'}, el('h2',{},'Team'), DimStats(d,people))),
      who ? el('div',{class:'card'}, el('h2',{},'Who is where'), who) : null,
      (d.key==='trust'||d.key==='autonomy') ? el('div',{}, el('h3',{},'Read with the Safeguards'), SafeguardsView(people,S)) : null);
  } else if (S.topic.startsWith('area:')){ const a=AREAS[+S.topic.slice(5)];
    detail = el('div',{}, el('div',{class:'card'}, el('h2',{}, a.name), el('div',{class:'note',style:'margin-bottom:8px'}, a.group), LayeredArea(a,people,S)),
      el('div',{class:'card'}, el('h2',{},'Team — how many at each level'), AreaHistogram(a,people,S)),
      el('div',{class:'card'}, el('h2',{},'In context — all areas'), CoverageHeatmap(people,S,i=>{S.topic='area:'+i;render();},a.i)));
  } else if (S.topic==='overview') detail = TeamOverview(people);
  else if (S.topic==='person') detail = el('div',{}, el('a',{href:'#',class:'note',onclick:e=>{e.preventDefault();S.topic='dim:'+S.dim;render();}},'← back'), PersonProfile(ALL[S.person],people,S));
  else if (S.topic==='stance') detail = StanceView(people,S);
  else if (S.topic==='safe') detail = SafeguardsView(people,S);
  else detail = el('div',{class:'card'}, el('h2',{},'Craft values × Comfort'), CraftScatter(people,S));
  root.append(el('div',{class:'side'}, list, detail));
}

/* ============================================================
   9. SWITCHER + RENDER
   ============================================================ */
const VARIANTS = {A:['Slice tabs',VariantA], B:['Overview wall',VariantB], C:['Explorer',VariantC]};
function readVariant(){ const q=new URLSearchParams(location.search).get('variant'); const h=location.hash.replace('#','').replace('variant=',''); const v=(q||h||'C').toUpperCase(); return VARIANTS[v]?v:'C'; }
function setVariant(v){ S.variant=v; try { const u=new URL(location.href); u.searchParams.set('variant',v); history.replaceState(null,'',u); } catch(e){ location.hash='variant='+v; } render(); }
function render(){
  const y = scrollY; const root = document.getElementById('app'); root.replaceChildren();
  VARIANTS[S.variant][1](root);
  const keys = Object.keys(VARIANTS), i = keys.indexOf(S.variant);
  document.getElementById('switcher').replaceChildren(
    el('button',{onclick:()=>setVariant(keys[(i+keys.length-1)%keys.length]),title:'previous (←)'},'‹'),
    el('span',{}, `${S.variant} — ${VARIANTS[S.variant][0]}`, el('span',{style:'opacity:.6'}, ` (${i+1}/${keys.length})`)),
    el('button',{onclick:()=>setVariant(keys[(i+1)%keys.length]),title:'next (→)'},'›'));
  scrollTo(0,y);
}
addEventListener('keydown', e=>{ if (['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName) || document.activeElement.isContentEditable) return; const keys=Object.keys(VARIANTS), i=keys.indexOf(S.variant); if (e.key==='ArrowRight') setVariant(keys[(i+1)%keys.length]); if (e.key==='ArrowLeft') setVariant(keys[(i+keys.length-1)%keys.length]); });
S.variant = readVariant();
{ const q = new URLSearchParams(location.search); if (q.get('view')==='export') S.view='export'; if (q.get('tab')) S.tab=q.get('tab'); if (q.get('topic')) S.topic=q.get('topic'); }
render();
</script>
